services:
  - type: web
    name: memmcp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m memmcp.server
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: MCP_TRANSPORT
        value: sse
      - key: GEMINI_API_KEY
        sync: false

